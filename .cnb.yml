# CNB 云原生构建配置文件
# 文档: https://docs.cnb.cool/zh/build/intro.html

# ===== 云原生开发环境配置 =====
# 用于在线开发、调试和测试容器
$:
  vscode:
    - services:
        - vscode
        - docker  # 开启 Docker 服务，用于运行容器
      docker:
        image: node:20-alpine
        volumes:
          - /root/.npm:copy-on-write
      env:
        IMAGE_TAG: docker.cnb.cool/xiongfeiwu/visitor-registration:latest
      stages:
        - name: 🔧 准备开发环境
          script: |
            echo "开发环境启动中..."
            npm install
            echo "✅ 开发环境准备完成!"
            echo ""
            echo "🐳 运行容器镜像测试命令:"
            echo "   docker pull ${IMAGE_TAG}"
            echo "   docker run -d -p 8080:80 --name visitor-app ${IMAGE_TAG}"
            echo ""
            echo "📦 本地开发命令:"
            echo "   npm run dev"

main:
  # 当推送到 main 分支时触发构建
  push:
    - services:
        - docker  # 开启 Docker 服务，自动登录 CNB 镜像仓库
      docker:
        image: node:20-alpine
        volumes:
          - /root/.npm:copy-on-write  # 缓存 npm 依赖
      env:
        # 镜像标签使用仓库路径和 commit SHA
        IMAGE_NAME: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
        IMAGE_TAG_LATEST: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
        IMAGE_TAG_SHA: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT_SHORT}
      stages:
        - name: 📦 安装依赖
          script: npm install

        - name: 🔨 构建应用
          script: npm run build

        - name: 🐳 构建 Docker 镜像
          script: |
            docker build -t ${IMAGE_TAG_LATEST} -t ${IMAGE_TAG_SHA} .
            echo "镜像构建完成: ${IMAGE_TAG_LATEST}"

        - name: 🚀 推送镜像到 CNB 镜像仓库
          script: |
            docker push ${IMAGE_TAG_LATEST}
            docker push ${IMAGE_TAG_SHA}
            echo "✅ 镜像推送成功!"
            echo "镜像地址: ${IMAGE_TAG_LATEST}"
            echo "镜像地址: ${IMAGE_TAG_SHA}"

        - name: 🚀 推送镜像到腾讯云容器镜像服务 (TCR)
          env:
            TCR_REGISTRY: xiongfeiwu.tencentcloudcr.com
            TCR_USERNAME: "100013033031"
            TCR_PASSWORD: "eyJhbGciOiJSUzI1NiIsImtpZCI6IkNZRE86SkZPWTpOVVlGOk9RNVU6UVFBSzo3SVdDOllGTkg6V1lLNDpFVEJBOjdaTFE6M1pOUTpHM0FGIn0.eyJvd25lclVpbiI6IjEwMDAxODAyMTkzMiIsIm9wZXJhdG9yVWluIjoiMTAwMDEzMDMzMDMxIiwiZXhwIjoxNzc2NTI3NzgxLCJuYmYiOjE3NzY1MjQxODEsImlhdCI6MTc3NjUyNDE4MX0.qZi7RAv2rXgJyupMalJNRSquHAmtPtyJG76vfpG_ZjrHlRp2HIny5kjtPvuInhx41x_WxV9rDCGShGsq7iLc6vCu6Fnf5Y8H2g77A0pvynmjMQz0p3UcXyE-3okcra1mMkkiYTxJ9KYKm7ooF2hUTFJHvdGaG5S_36LmF65KB4PHoVnMI3L6MWiM8Vfkiufvm86UPRtq-RlqqKZa6-L3wwk2vAZ1DpOXAwcHlvGn2H-WJlTVmInPctiDYboADb_nA6cmnZNF4wyRpmTgXv7_eD23hDcOJJ38wPPUuql2Ki6rgJ7zkuALWfoYszYtBrwHDXhCsAJY-OyUenjRGBmOIw"
          script: |
            echo "登录腾讯云容器镜像服务 (TCR)..."
            echo "${TCR_PASSWORD}" | docker login ${TCR_REGISTRY} -u ${TCR_USERNAME} --password-stdin
            
            # 重新标记镜像 (需要指定命名空间，这里使用 visitor-registration)
            TCR_IMAGE_LATEST="${TCR_REGISTRY}/visitor-registration/visitor-registration:latest"
            TCR_IMAGE_SHA="${TCR_REGISTRY}/visitor-registration/visitor-registration:${CNB_COMMIT_SHORT}"
            
            docker tag ${IMAGE_TAG_LATEST} ${TCR_IMAGE_LATEST}
            docker tag ${IMAGE_TAG_LATEST} ${TCR_IMAGE_SHA}
            
            # 推送到 TCR
            docker push ${TCR_IMAGE_LATEST}
            docker push ${TCR_IMAGE_SHA}
            
            echo "✅ TCR 镜像推送成功!"
            echo "TCR 镜像地址: ${TCR_IMAGE_LATEST}"
            echo "TCR 镜像地址: ${TCR_IMAGE_SHA}"

