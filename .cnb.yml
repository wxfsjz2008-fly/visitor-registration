# CNB 云原生构建配置文件
# 文档: https://docs.cnb.cool/zh/build/intro.html

# ===== 云原生开发环境配置 =====
# 用于在线开发、调试和测试容器
$:
  vscode:
    - services:
        - vscode
        - docker  # 开启 Docker 服务，用于运行容器
      docker:
        image: node:20-alpine
        volumes:
          - /root/.npm:copy-on-write
      env:
        IMAGE_TAG: docker.cnb.cool/xiongfeiwu/visitor-registration:latest
      stages:
        - name: 🔧 准备开发环境
          script: |
            echo "开发环境启动中..."
            npm install
            echo "✅ 开发环境准备完成!"
            echo ""
            echo "🐳 运行容器镜像测试命令:"
            echo "   docker pull ${IMAGE_TAG}"
            echo "   docker run -d -p 8080:80 --name visitor-app ${IMAGE_TAG}"
            echo ""
            echo "📦 本地开发命令:"
            echo "   npm run dev"

main:
  # 当推送到 main 分支时触发构建
  push:
    - services:
        - docker  # 开启 Docker 服务，自动登录 CNB 镜像仓库
      docker:
        image: node:20-alpine
        volumes:
          - /root/.npm:copy-on-write  # 缓存 npm 依赖
      env:
        # 镜像标签使用仓库路径和 commit SHA
        IMAGE_NAME: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
        IMAGE_TAG_LATEST: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
        IMAGE_TAG_SHA: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT_SHORT}
      stages:
        - name: 📦 安装依赖
          script: npm install

        - name: 🔨 构建应用
          script: npm run build

        - name: 🐳 构建 Docker 镜像
          script: |
            docker build -t ${IMAGE_TAG_LATEST} -t ${IMAGE_TAG_SHA} .
            echo "镜像构建完成: ${IMAGE_TAG_LATEST}"

        - name: 🚀 推送镜像到 CNB 镜像仓库
          script: |
            docker push ${IMAGE_TAG_LATEST}
            docker push ${IMAGE_TAG_SHA}
            echo "✅ 镜像推送成功!"
            echo "镜像地址: ${IMAGE_TAG_LATEST}"
            echo "镜像地址: ${IMAGE_TAG_SHA}"

        - name: 🚀 推送镜像到 TKE 镜像仓库
          env:
            TKE_REGISTRY: ccr.ccs.tencentyun.com
            TKE_NAMESPACE: xiongfei
            TKE_IMAGE_NAME: xiongfeiwu
            TKE_USERNAME: "100013033031"
            TKE_PASSWORD: "AAAA@1111"
          script: |
            echo "登录 TKE 镜像仓库..."
            echo "${TKE_PASSWORD}" | docker login ${TKE_REGISTRY} -u ${TKE_USERNAME} --password-stdin
            
            # 重新标记镜像
            TKE_IMAGE_LATEST="${TKE_REGISTRY}/${TKE_NAMESPACE}/${TKE_IMAGE_NAME}:latest"
            TKE_IMAGE_SHA="${TKE_REGISTRY}/${TKE_NAMESPACE}/${TKE_IMAGE_NAME}:${CNB_COMMIT_SHORT}"
            
            docker tag ${IMAGE_TAG_LATEST} ${TKE_IMAGE_LATEST}
            docker tag ${IMAGE_TAG_LATEST} ${TKE_IMAGE_SHA}
            
            # 推送到 TKE
            docker push ${TKE_IMAGE_LATEST}
            docker push ${TKE_IMAGE_SHA}
            
            echo "✅ TKE 镜像推送成功!"
            echo "TKE 镜像地址: ${TKE_IMAGE_LATEST}"
            echo "TKE 镜像地址: ${TKE_IMAGE_SHA}"

