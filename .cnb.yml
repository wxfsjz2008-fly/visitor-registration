# CNB 云原生构建配置文件
# 文档: https://docs.cnb.cool/zh/build/intro.html

main:
  # 当推送到 main 分支时触发构建
  push:
    - services:
        - docker  # 开启 Docker 服务，自动登录 CNB 镜像仓库
      docker:
        image: node:20-alpine
        volumes:
          - /root/.npm:copy-on-write  # 缓存 npm 依赖
      env:
        # 镜像标签使用仓库路径和 commit SHA
        IMAGE_NAME: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
        IMAGE_TAG_LATEST: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
        IMAGE_TAG_SHA: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT_SHORT_SHA}
      stages:
        - name: 📦 安装依赖
          script: npm ci

        - name: 🔨 构建应用
          script: npm run build

        - name: 🐳 构建 Docker 镜像
          script: |
            docker build -t ${IMAGE_TAG_LATEST} -t ${IMAGE_TAG_SHA} .
            echo "镜像构建完成: ${IMAGE_TAG_LATEST}"

        - name: 🚀 推送镜像到 CNB 镜像仓库
          script: |
            docker push ${IMAGE_TAG_LATEST}
            docker push ${IMAGE_TAG_SHA}
            echo "✅ 镜像推送成功!"
            echo "镜像地址: ${IMAGE_TAG_LATEST}"
            echo "镜像地址: ${IMAGE_TAG_SHA}"

