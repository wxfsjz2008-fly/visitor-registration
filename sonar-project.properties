sonar.projectKey=visitor-registration
sonar.organization=wxfsjz2008-fly
sonar.projectName=visitor-registration
sonar.host.url=https://sonarcloud.io

# Source code paths
sonar.sources=src

# Test paths (excluded from coverage calculation)
sonar.tests=src/__tests__

# TypeScript/JavaScript file patterns
sonar.inclusions=src/**/*.ts,src/**/*.tsx
sonar.test.inclusions=src/__tests__/**/*.ts,src/__tests__/**/*.tsx

# Coverage reports (generated by vitest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude generated and config files
sonar.exclusions=src/__tests__/**,src/vite-env.d.ts

# Source encoding
sonar.sourceEncoding=UTF-8
